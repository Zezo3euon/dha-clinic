services:
  - type: web
    name: dha-clinic-system
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLINIC_NAME
        value: "عيادة الدكتور حاتم عواجة"
      - key: CLINIC_SPECIALTY
        value: "استشاري أمراض النساء والتوليد وجراحة المناظير وعلاج العقم"
      - key: DATABASE_URL
        fromDatabase:
          name: dha-clinic-db
          property: connectionString

databases:
  - name: dha-clinic-db
    databaseName: dha_clinic
    user: dha_admin
    plan: free
    region: frankfurt

